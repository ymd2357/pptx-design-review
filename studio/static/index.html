<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPTX Lint/Fix Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>PPTX Lint/Fix Studio</h1>
      <span class="sub">アップロード → スライド毎に LINT 項目を ON/OFF → 適用 → 修正済み PPTX を取得</span>
    </header>

    <main>
      <section id="dropzone" class="dropzone">
        <input type="file" id="file-input" accept=".pptx" hidden />
        <p class="dz-title">PPTX をドラッグ&ドロップ</p>
        <p class="dz-sub">または<button id="browse-btn" class="link">ファイルを選択</button></p>
        <p id="upload-status" class="status"></p>
      </section>

      <section id="toolbar" class="toolbar hidden">
        <div class="meta">
          <strong id="deck-name"></strong>
          <span id="deck-stats" class="muted"></span>
        </div>
        <div class="actions">
          <button id="select-all" class="btn ghost">全 ON</button>
          <button id="select-none" class="btn ghost">全 OFF</button>
          <button id="apply-btn" class="btn primary">選択を適用</button>
          <a id="download-btn" class="btn success disabled" href="#">修正済みを DL</a>
        </div>
      </section>

      <section id="apply-summary" class="apply-summary hidden"></section>

      <section id="slides" class="slides"></section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-inner">
        <div class="modal-head">
          <span id="modal-title"></span>
          <button id="modal-close" class="btn ghost">閉じる</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
